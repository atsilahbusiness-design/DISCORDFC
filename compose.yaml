services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-football_rising_star}
      POSTGRES_USER: ${POSTGRES_USER:-frs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  bot:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-frs}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-football_rising_star}
      DATA_FILE: /app/data/players.json
    command: ["sh", "-c", "node dist/storage/migrate.js && node dist/index.js"]
    volumes:
      - bot-data:/app/data

volumes:
  bot-data:
  postgres-data:
