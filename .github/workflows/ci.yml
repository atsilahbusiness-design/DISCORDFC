name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: football_rising_star
          POSTGRES_USER: frs
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frs -d football_rising_star"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Secret pattern scan
        shell: bash
        run: |
          if git grep -n -E 'DISCORD_TOKEN=[^r][^e][^p]|BEGIN (RSA|OPENSSH)|ghp_[A-Za-z0-9]+' -- ':!pnpm-lock.yaml' ':!.env.example'; then
            echo 'Potential secret pattern found.'
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Unit and domain tests
        run: pnpm test

      - name: PostgreSQL migration smoke test
        env:
          DATABASE_URL: postgresql://frs:ci_password@localhost:5432/football_rising_star
        run: node dist/storage/migrate.js

      - name: Docker build
        run: docker build --tag football-rising-star-discord:ci .
